name: Build and publish Tauron release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tauron-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native app and package release
        run: |
          APP="$RUNNER_TEMP/Tauron.app"
          PACKAGE="$RUNNER_TEMP/tauron-package"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$PACKAGE"
          cp Tauron.app/Contents/Info.plist "$APP/Contents/Info.plist"
          cp Tauron.app/Contents/Resources/Tauron.icns "$APP/Contents/Resources/Tauron.icns"
          cp TERMS_OF_SERVICE.md "$APP/Contents/Resources/TERMS_OF_SERVICE.md"
          swiftc -parse-as-library -swift-version 5 -O -framework SwiftUI -framework AppKit -framework Security TauronApp.swift TauronAssistant.swift -o "$APP/Contents/MacOS/Tauron"
          chmod +x "$APP/Contents/MacOS/Tauron"
          cp README.md TERMS_OF_SERVICE.md install.command Tauron.command tauron.py tauron_gui.py tauron-updater.py update-config.json VERSION CHANGELOG.md TauronApp.swift TauronAssistant.swift "$PACKAGE/"
          cp -R examples "$PACKAGE/examples"
          cp -R "$APP" "$PACKAGE/Tauron.app"
          (cd "$PACKAGE" && zip -r "$GITHUB_WORKSPACE/tauron-macos.zip" .)
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(cat VERSION)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" tauron-macos.zip --clobber
          else
            gh release create "$VERSION" tauron-macos.zip --generate-notes
          fi
