name: Build and publish Tauron release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package macOS install files
        run: zip -r tauron-macos.zip README.md install.command Tauron.command tauron.py tauron_gui.py tauron-updater.py update-config.json VERSION CHANGELOG.md examples Tauron.app
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(cat VERSION)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" tauron-macos.zip --clobber
          else
            gh release create "$VERSION" tauron-macos.zip --generate-notes
          fi
